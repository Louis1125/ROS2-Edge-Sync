syntax = "proto3";

package edge_sync.protocol.v1;

import "v1/manifest.proto";
import "v1/transfer.proto";

// Sent by a connecting robot to identify itself and negotiate the protocol.
message HandshakeRequest {
    string robot_id = 1;
    string public_key_id = 2;
    uint32 protocol_version = 3;
    string auth_token = 4;   // HMAC-SHA256(shared_secret, robot_id), hex
}

message HandshakeResponse {
    string robot_id = 1;
    uint32 protocol_version = 2;
    bool accepted = 3;
    string reason = 4;   // set when accepted == false
}

message SyncRequest {
    string target_robot_id = 1;
    string artifact_id = 2;
}

message SyncResult {
    bool success = 1;
    string artifact_id = 2;
    string manifest_id = 3;
    string error = 4;
}

// Every remote message is wrapped in an envelope carrying identity and version.
message MessageEnvelope {
    string robot_id = 1;
    string request_id = 2;
    uint32 protocol_version = 3;

    oneof payload {
        HandshakeRequest handshake_request = 10;
        HandshakeResponse handshake_response = 11;
        ManifestRequest manifest_request = 13;
        ManifestResponse manifest_response = 17;
        TransferRequest transfer_request = 20;
        TransferResponse transfer_response = 21;
        ChunkRequest chunk_request = 22;
        ChunkData chunk_data = 23;
        ChunkAck chunk_ack = 24;
    }
}
