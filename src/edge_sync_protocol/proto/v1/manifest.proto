syntax = "proto3";

package edge_sync.protocol.v1;

import "v1/common.proto";

message ChunkDescriptor {
    uint64 index = 1;
    uint64 offset = 2;
    uint32 size = 3;
    Hash hash = 4;
}

message ArtifactManifest {
    string artifact_id = 1;
    uint32 version_major = 2;
    uint32 version_minor = 3;
    uint32 version_patch = 4;
    uint32 schema_version = 5;
    uint64 total_size = 6;
    uint32 chunk_size = 7;
    Hash artifact_hash = 8;
    repeated ChunkDescriptor chunks = 9;
}

message ManifestRequest {
    string artifact_id = 1;
}

message ManifestResponse {
    bool found = 1;
    ArtifactManifest manifest = 2;
}
