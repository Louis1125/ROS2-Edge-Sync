apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-sync.fullname" . }}-frontend
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ include "edge-sync.fullname" . }}-frontend }
  template:
    metadata:
      labels: { app: {{ include "edge-sync.fullname" . }}-frontend }
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.frontend.repository }}:{{ .Values.image.frontend.tag }}"
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-sync.fullname" . }}-frontend
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
spec:
  selector: { app: {{ include "edge-sync.fullname" . }}-frontend }
  ports: [{ port: 80 }]
