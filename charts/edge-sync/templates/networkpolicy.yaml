{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "edge-sync.fullname" . }}
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "edge-sync.fullname" . }}-control-plane
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
        - port: 7443
{{- end }}
