apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-sync.fullname" . }}-gateway
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
spec:
  type: LoadBalancer
  selector: { app: {{ include "edge-sync.fullname" . }}-control-plane }
  ports:
    - name: agent
      port: 7443
      targetPort: 7443
