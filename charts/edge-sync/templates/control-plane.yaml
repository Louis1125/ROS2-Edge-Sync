apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "edge-sync.fullname" . }}-control-plane
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app: {{ include "edge-sync.fullname" . }}-control-plane }
  template:
    metadata:
      labels: { app: {{ include "edge-sync.fullname" . }}-control-plane }
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.controlPlane.repository }}:{{ .Values.image.controlPlane.tag }}"
          imagePullPolicy: {{ .Values.image.controlPlane.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
            - name: agent
              containerPort: 7443
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "edge-sync.fullname" . }}
                  key: database-url
            - name: MIGRATIONS_DIR
              value: /opt/edge-sync/migrations
            - name: EDGE_SYNC_FLEET_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "edge-sync.fullname" . }}
                  key: fleet-secret
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {{ .Values.resources.controlPlane.requests | toJson }}
            limits: {{ .Values.resources.controlPlane.limits | toJson }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "edge-sync.fullname" . }}-control-plane
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
spec:
  selector: { app: {{ include "edge-sync.fullname" . }}-control-plane }
  ports:
    - name: http
      port: 8080
    - name: agent
      port: 7443
