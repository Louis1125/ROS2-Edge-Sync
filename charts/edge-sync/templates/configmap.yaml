apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge-sync.fullname" . }}
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
data:
  database-url: host={{ if .Values.postgres.enabled }}{{ include "edge-sync.fullname" . }}-postgres{{ else }}{{ .Values.postgres.host }}{{ end }} port={{ .Values.postgres.port }} dbname={{ .Values.postgres.database }} user={{ .Values.postgres.user }} password={{ .Values.postgres.password }}
