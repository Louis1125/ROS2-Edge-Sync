apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "edge-sync.fullname" . }}
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
data:
  database-url: host={{ .Values.postgres.host }} port={{ .Values.postgres.port }} dbname={{ .Values.postgres.database }} user={{ .Values.postgres.user }} password={{ .Values.postgres.password }}
