apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "edge-sync.fullname" . }}-migrate
  labels:
    {{- include "edge-sync.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  template:
    metadata:
      labels: { app: {{ include "edge-sync.fullname" . }}-migrate }
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          command: ["edge_sync_control_plane", "--migrate-only"]
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "edge-sync.fullname" . }}
                  key: database-url
            - name: MIGRATIONS_DIR
              value: /opt/edge-sync/migrations
