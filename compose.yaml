services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edge_sync
      POSTGRES_USER: edge_sync
      POSTGRES_PASSWORD: edge_sync
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge_sync"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - edge-network

  control-plane:
    build:
      context: .
      dockerfile: docker/control-plane.Dockerfile
    environment:
      DATABASE_URL: host=postgres port=5432 dbname=edge_sync user=edge_sync password=edge_sync
      MIGRATIONS_DIR: /workspace/apps/edge_sync_control_plane/migrations
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edge-network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - control-plane
    networks:
      - edge-network

  # Interactive development container.
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        ROS_DISTRO: humble
    working_dir: /workspace
    volumes:
      - .:/workspace
      - build-data:/workspace/build
      - install-data:/workspace/install
      - log-data:/workspace/log
    command: sleep infinity

  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: humble
    command: ["edge_syncd", "--config", "/config/coordinator.yaml"]
    volumes:
      - ./config:/config:ro
      - coordinator-data:/var/lib/edge-sync
    networks:
      - edge-network

  robot-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: humble
    command: ["edge_syncd", "--config", "/config/robot-a.yaml"]
    volumes:
      - ./config:/config:ro
      - robot-a-data:/var/lib/edge-sync
    networks:
      - edge-network

  robot-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: humble
    command: ["edge_syncd", "--config", "/config/robot-b.yaml"]
    volumes:
      - ./config:/config:ro
      - robot-b-data:/var/lib/edge-sync
    networks:
      - edge-network

volumes:
  postgres-data:
  build-data:
  install-data:
  log-data:
  coordinator-data:
  robot-a-data:
  robot-b-data:

networks:
  edge-network:
    driver: bridge
