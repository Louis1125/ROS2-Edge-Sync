services:
  # Interactive development container.
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
      args:
        ROS_DISTRO: humble
    working_dir: /workspace
    volumes:
      - .:/workspace
      - build-data:/workspace/build
      - install-data:/workspace/install
      - log-data:/workspace/log
    command: sleep infinity

  coordinator:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: humble
    command: ["edge_syncd", "--config", "/config/coordinator.yaml"]
    volumes:
      - ./config:/config:ro
      - coordinator-data:/var/lib/edge-sync
    networks:
      - edge-network

  robot-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: humble
    command: ["edge_syncd", "--config", "/config/robot-a.yaml"]
    volumes:
      - ./config:/config:ro
      - robot-a-data:/var/lib/edge-sync
    networks:
      - edge-network

  robot-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.runtime
      args:
        ROS_DISTRO: humble
    command: ["edge_syncd", "--config", "/config/robot-b.yaml"]
    volumes:
      - ./config:/config:ro
      - robot-b-data:/var/lib/edge-sync
    networks:
      - edge-network

volumes:
  build-data:
  install-data:
  log-data:
  coordinator-data:
  robot-a-data:
  robot-b-data:

networks:
  edge-network:
    driver: bridge
